name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install python-json-logger>=2.0.7 ruff pytest-cov pytest-asyncio

      - name: Lint
        run: ruff check app/ tests/ --select=E,W,F --ignore=E501

      - name: Run tests
        env:
          LOG_FORMAT: text
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ -q \
            --no-cov \
            --ignore=tests/deepeval \
            --ignore=tests/manual \
            --ignore=tests/integration \
            -x --tb=short

      - name: Coverage report
        env:
          LOG_FORMAT: text
          LOG_LEVEL: WARNING
        run: |
          pytest tests/ \
            --ignore=tests/deepeval \
            --ignore=tests/manual \
            --ignore=tests/integration \
            --cov=app --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t finnie-chat-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t finnie-chat-frontend:ci .
